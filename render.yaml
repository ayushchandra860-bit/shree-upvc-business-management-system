services:
  - type: web
    name: shree-upvc-business-management-system
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
